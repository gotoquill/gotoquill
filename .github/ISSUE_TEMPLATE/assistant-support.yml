name: Assistant support request
description: Request support for another assistant or MCP host
labels: [enhancement]
body:
  - type: input
    id: host
    attributes:
      label: Assistant or host name and version
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Public integration documentation URL
  - type: textarea
    id: workflow
    attributes:
      label: Desired signing workflow and current limitations
    validations:
      required: true
