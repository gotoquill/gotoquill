name: Something works badly or could be better
description: Something works, but it is confusing, slow, fragile or awkward
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: For something that is clearly broken, use Bug report. Use synthetic documents only, and do not include personal data, credentials or signing links that contain a `#` key.
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      description: The task or goal, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What worked badly?
      description: What was confusing, slow, unreliable or harder than it should be.
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: What would have been better?
      description: The behavior or wording you would expect.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: gotoquill version, operating system, Python version, and the assistant or host.
