name: Local CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        type: boolean
        default: false
  schedule:
    - cron: "47 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      full: ${{ steps.filter.outputs.full }}
      python: ${{ steps.filter.outputs.python }}
      worker: ${{ steps.filter.outputs.worker }}
      site: ${{ steps.filter.outputs.site }}
      plugin: ${{ steps.filter.outputs.plugin }}
      ts: ${{ steps.filter.outputs.ts }}
      contracts: ${{ steps.filter.outputs.contracts }}
      browser: ${{ steps.filter.outputs.browser }}
      build: ${{ steps.filter.outputs.build }}
      npm-audit: ${{ steps.filter.outputs.npm-audit }}
      pip-audit: ${{ steps.filter.outputs.pip-audit }}
      python-versions: ${{ steps.filter.outputs.python-versions }}
      contract-tests: ${{ steps.filter.outputs.contract-tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check CI filter and aggregate regressions
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci.py' -v
      # PRs and main use Python 3.10 + 3.13; full events use 3.10 through 3.13.
      - id: filter
        env:
          FORCE_FULL: ${{ inputs.force_full || false }}
        run: python3 .github/scripts/ci_filter.py

  ci-light:
    needs: setup
    if: needs.setup.outputs.heavy == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs and metadata only; no application validation selected."

  test:
    needs: setup
    if: needs.setup.outputs.python == 'true' || needs.setup.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.python-versions) }}
    env:
      GOTOQUILL_REAL_RELAY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install poppler (pdftoppm for render tests)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  ts-tests:
    needs: setup
    if: needs.setup.outputs.ts == 'true' || needs.setup.outputs.full == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --import tsx --test test/*.test.ts

  contracts:
    needs: setup
    if: needs.setup.outputs.contracts == 'true' && needs.setup.outputs.python != 'true' && needs.setup.outputs.full != 'true'
    runs-on: ubuntu-latest
    env:
      GOTOQUILL_REAL_RELAY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Run selected cross-area contracts
        env:
          CONTRACT_TESTS: ${{ needs.setup.outputs.contract-tests }}
        run: |
          python - <<'PYTEST'
          import json, os, subprocess, sys
          subprocess.run([sys.executable, '-m', 'pytest', '-q', *json.loads(os.environ['CONTRACT_TESTS'])], check=True)
          PYTEST

  ci-required:
    needs: [setup, ci-light, test, ts-tests, contracts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected validation job
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_required.py
