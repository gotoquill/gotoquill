name: CLA Assistant

# CLA Assistant Lite: https://github.com/contributor-assistant/github-action
# NOTE: upstream was archived (read-only) in Mar 2026; v2.6.1 still works (runs on node20).
# Pinned to the full commit SHA of tag v2.6.1 (resolved via git ls-remote on 2026-11-16).
# Signatures are stored in this same repository, on branch 'cla-signatures'
# (created automatically on first signature), in signatures/version1/cla.json.
# Same-repo storage works with the built-in GITHUB_TOKEN; a PERSONAL_ACCESS_TOKEN
# secret is only needed if you move signatures to a different (e.g. private) repo
# via remote-organization-name / remote-repository-name.
# If 'main' is branch-protected, the cla-signatures branch must stay unprotected.

# Runs only for pull requests (and comments on pull requests), and is skipped while the
# repository is private, so it never fails before launch.
# Keep it off while private to avoid consuming GitHub Actions minutes.
# After public launch, enable only after Shay approves the CLA and its signing process.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  CLAAssistant:
    permissions:
      contents: write       # signature branch only; action cannot scope this further
      pull-requests: write  # CLA comments
      statuses: write       # CLA status check
    if: >-
      ${{ !github.event.repository.private && vars.CLA_ENABLED == 'true' &&
          (github.event_name == 'pull_request_target' || github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # only for remote signature repo
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: '${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: shay2301,dependabot[bot],github-actions[bot],renovate[bot],*[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: 'Thank you for your contribution! Before we can merge it, please read the [Contributor License Agreement](${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md) and sign it by posting the comment below in this PR.'
