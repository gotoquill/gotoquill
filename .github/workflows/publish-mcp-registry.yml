name: Publish to MCP Registry

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gotoquill/gotoquill'
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check manifest and package versions match
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          manifest = json.loads(Path("server.json").read_text())
          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if not manifest["version"] == version == manifest["packages"][0]["version"]:
              raise SystemExit("server.json, pyproject.toml and package versions must match")
          print(f"Manifest and package versions match: {version}")
          PY
      - name: Validate server manifest schema
        run: |
          python -m pip install jsonschema
          python scripts/validate-server-manifest.py
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server manifest
        run: ./mcp-publisher publish
